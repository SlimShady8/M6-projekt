  <title>Tetris – GameFund</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tetris-bg {
      background: #121216;
      min-height: calc(100vh - 62px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 20px 50px;
      color: white;
    }
    canvas {
      background: black;
      display: block;
      border: 2px solid rgba(147, 51, 234, 0.5);
      border-radius: 4px;
      margin-top: 20px;
    }
    .tetris-score {
      font-size: 1.5em;
      color: #a855f7;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="forside.html">🎮 GameFund</a>
    <div class="nav-links">
      <a href="spil.html">Spil</a>
      <a href="leaderboard.html">Highscore</a>
      <a href="updates.html">Opdateringer</a>
      <a href="belønner.html">Belønninger</a>
      <a href="Omos.html">Om os</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="donate.html" class="nav-donate">Støt Nu</a>
    </div>
  </nav>

  <div class="tetris-bg">
    <h1 style="color:#a855f7; margin-bottom:5px;">🧩 Tetris</h1>
    <p style="opacity:0.6; margin-bottom:10px;">Brug pil-taster. Space = hurtig ned.</p>
    <div class="tetris-score">Score: <span id="scoreDisplay">0</span></div>
    <canvas id="game" width="300" height="600"></canvas>
    <p style="margin-top:20px; opacity:0.5; font-size:0.85em;">← <a href="spil.html" style="color:#a855f7; text-decoration:none;">Tilbage til spil-oversigten</a></p>
